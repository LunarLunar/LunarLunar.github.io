<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>單字聽寫練習系統 Week20-23</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f0f2f5;
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
    }
    .box {
      background-color: #ffffff;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .label {
      font-weight: bold;
      margin-bottom: 8px;
      color: #555;
    }
    .content {
      font-size: 20px;
      padding: 10px;
      background: #f9f9f9;
      border-radius: 4px;
      min-height: 30px;
    }
    button {
      padding: 20px 40px; /* Doubled from 10px 20px */
      margin-right: 20px; /* Doubled from 10px */
      font-size: 32px; /* Doubled from 16px */
      border: none;
      border-radius: 8px; /* Doubled from 4px */
      color: white;
      background-color: #007BFF;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .status {
      margin-top: 10px;
      color: #666;
    }
  </style>
</head>
<body>

  <h2 style="text-align: center;">單字聽寫練習系統 Week20-23</h2>

  <div class="box">
    <div class="label">🔹 中文翻譯區（A1）</div>
    <div id="a1" class="content">請按「下一題」開始</div>
  </div>

  <div class="box">
    <div class="label">🔹 上一題答案（A2）</div>
    <div id="a2" class="content"></div>
  </div>

  <div style="text-align: center;">
    <button onclick="playSound()">🔊 發音</button>
    <button onclick="nextWord()">➡️ 下一題</button>
  </div>

  <div class="status" id="status"></div>

  <script>
const wordList = [
  "argue", "award", "carpet", "carton", "carve", "charm", "garden", "harvest", "quarter", "regard",
  "reward", "starve", "swarm", "tardy", "toward", "warmth", "warning", "wharf", "guard", "sergeant",
  "verse", "swerve", "curve", "whirl", "worship", "hurdle", "curb", "purchase", "thirsty", "flirt",
  "preserve", "herb", "nerve", "swirl", "worm", "turkey", "blur", "refer", "herd", "worst",
  "tailor", "humor", "clever", "collar", "mayor", "dealer", "swimmer", "jogger", "cellar", "pillar",
  "proper", "saucer", "editor", "tutor", "lunar", "armor", "polar", "speaker", "inventor", "horror",
  "hospital", "ankle", "pupil", "apron", "burden", "sandal", "pedal", "label", "certain", "swollen",
  "evil", "general", "peddle", "whistle", "curtain", "pardon", "medal", "barrel", "captain", "saddle"
];
    let usedWords = [];
    let currentWord = '';
    let previousWord = '';

    async function translateWord(word) {
      try {
        const response = await fetch(`https://api.mymemory.translated.net/get?q=${word}&langpair=en|zh-TW`);
        const data = await response.json();
        return data.responseData.translatedText || '翻譯錯誤';
      } catch {
        return '翻譯失敗';
      }
    }

    async function nextWord() {
      if (wordList.length === 0) {
        document.getElementById('status').innerText = '✔️ 單字已完成！';
        document.getElementById('a1').innerText = '';
        return;
      }

      previousWord = currentWord;
      currentWord = wordList.shift();
      usedWords.push(currentWord);

      if (previousWord) {
        const prevTrans = await translateWord(previousWord);
        document.getElementById('a2').innerText = `${previousWord}：${prevTrans}`;
      }

      const newTrans = await translateWord(currentWord);
      document.getElementById('a1').innerText = newTrans;
      document.getElementById('status').innerText = `剩餘單字：${wordList.length}`;
    }

    function playSound() {
      if (!currentWord) {
        alert("請先按『下一題』取得單字");
        return;
      }
      const utter = new SpeechSynthesisUtterance(currentWord);
      utter.lang = 'en-US';
      speechSynthesis.speak(utter);
    }
  </script>

</body>
</html>
